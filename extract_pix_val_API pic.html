<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Satellite Data Center Hero</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0b1220;
            font-family: Arial, sans-serif;
        }

        /* 🌍 HERO AREA WITH SPACE CONTROL */
        .hero {
            position: relative;
            height: 100vh;
            width: 100%;
            overflow: hidden;
        }

        /* IMAGE (LEAVES 30% RIGHT + 30% BOTTOM SPACE) */
        .hero img {
            position: absolute;
            top: 0;
            left: 0;

            width: 70%;
            /* 🔥 leaves 30% on right */
            height: 80%;
            /* 🔥 leaves 30% on bottom */

            object-fit: cover;
            filter: brightness(0.5);
        }

        /* RIGHT SIDE SOFT GLOW */
        .glow {
            position: absolute;
            top: 0;
            right: 0;
            width: 30%;
            height: 100%;
            background: linear-gradient(to left, rgba(0, 255, 213, 0.18), transparent);
        }

        /* BOTTOM FADE SPACE */
        .bottom-fade {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 30%;
            background: linear-gradient(to top, #0b1220, transparent);
        }

        /* CONTENT */
        .hero-content {
            position: relative;
            z-index: 2;
            padding: 70px;
            max-width: 600px;
            color: white;
        }

        /* BADGE */
        .badge-api {
            display: inline-block;
            background: rgba(0, 255, 200, 0.15);
            border: 1px solid rgba(0, 255, 200, 0.4);
            color: #00ffd5;
            padding: 6px 12px;
            border-radius: 30px;
            font-size: 13px;
            margin-bottom: 15px;
        }

        /* TITLE */
        .hero-title {
            font-size: 38px;
            font-weight: bold;
            line-height: 1.2;
        }

        /* DESC */
        .hero-desc {
            font-size: 16px;
            opacity: 0.9;
            margin-top: 15px;
        }

        /* BUTTON */
        .hero-btn {
            margin-top: 25px;
            display: inline-block;
            background: #00ffd5;
            color: #000;
            padding: 12px 18px;
            border-radius: 10px;
            font-weight: bold;
            text-decoration: none;
        }

        .hero-btn:hover {
            background: #00c7a8;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .hero img {
                width: 100%;
                height: 60%;
            }

            .hero-content {
                padding: 30px;
            }

            .hero-title {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <div class="hero">

        <!-- SATELLITE IMAGE -->
        <img src="https://images.unsplash.com/photo-1446776811953-b23d57bd21aa?auto=format&fit=crop&w=2000&q=80"
            alt="Satellite Earth Observation">

        <!-- RIGHT SPACE EFFECT -->
        <div class="glow"></div>

        <!-- BOTTOM SPACE EFFECT -->
        <div class="bottom-fade"></div>

        <!-- CONTENT -->
        <div class="hero-content">

            <div class="badge-api">
                Extract Satellite data by Location

            </div>
            <br>
            <br>

            <div class="hero-title">
                Satellite Data Extraction API
            </div>

            <div class="hero-desc">
                Retrieve point-level satellite-derived climate, environmental, and disaster risk indicators for any
                geographic location using latitude and longitude coordinates.

            </div>
            <br>
            <a href="#" class="hero-btn">
                📍 Query Location
            </a>

        </div>

    </div>

</body>

</html>
